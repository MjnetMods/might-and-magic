{{- with .Params.colorScheme -}}
  {{/* Load per-page color scheme CSS, overriding the global one */}}
  {{- $css := resources.Get (printf "css/schemes/%s.css" (lower .)) -}}
  {{- with $css -}}
    {{- $css = $css | minify | fingerprint -}}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  {{- end -}}

  {{/* Atmospheric background per school */}}
  <style>
  html { image-rendering: pixelated; }
  body { background-color: transparent !important; }
  body * { color: #ffffff !important; }
  body h1, body h2, body h3, body h4, body h5, body h6 { color: rgba(255,255,255,0.72) !important; }

  {{- if eq . "avocado" }}
  html {
    background-color: #141a14;
    background-image:
      radial-gradient(ellipse at 50% -5%, rgba(20, 70, 20, 0.55) 0%, transparent 60%),
      linear-gradient(rgba(20, 26, 20, 0.96), rgba(20, 26, 20, 0.96)),
      url('/textures/block/living_rock.png');
    background-size: auto, auto, 64px 64px;
  }

  {{- else if eq . "fire" }}
  html {
    background-color: #1a0a0a;
    background-image:
      radial-gradient(ellipse at 50% -5%, rgba(100, 8, 8, 0.60) 0%, transparent 60%),
      linear-gradient(rgba(26, 10, 10, 0.96), rgba(26, 10, 10, 0.96)),
      url('/textures/block/living_rock_brick.png');
    background-size: auto, auto, 64px 64px;
  }

  {{- else if eq . "ocean" }}
  html {
    background-color: #080a1a;
    background-image:
      radial-gradient(ellipse at 50% -5%, rgba(8, 20, 100, 0.55) 0%, transparent 60%),
      linear-gradient(rgba(8, 10, 26, 0.96), rgba(8, 10, 26, 0.96)),
      url('/textures/block/living_rock_polished.png');
    background-size: auto, auto, 64px 64px;
  }

  {{- else if eq . "slate" }}
  html {
    background-color: #0e0e12;
    background-image:
      radial-gradient(ellipse at 50% -5%, rgba(50, 55, 80, 0.35) 0%, transparent 60%),
      linear-gradient(rgba(80, 80, 100, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80, 80, 100, 0.04) 1px, transparent 1px);
    background-size: auto, 32px 32px, 32px 32px;
  }
  {{- end }}
  </style>
{{- end -}}
