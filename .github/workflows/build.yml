name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate design docs
        run: ./gradlew validateDesignDocs

      - name: Build
        run: ./gradlew build

      - name: Run data generators
        run: ./gradlew runData

      - name: Run unit tests
        run: ./gradlew test

      - name: Run game tests
        run: ./gradlew runGameTestServer

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: might-and-magic-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
